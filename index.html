<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignedIt - Recipient Signing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root {
  --bg: #f3f3f1;
  --panel: #fff;
  --ink: #25272a;
  --muted: #74777a;
  --line: #dedfdd;
  --dark: #303236;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
.brand { font: 600 22px Georgia, serif; letter-spacing: -0.5px; }
.btn {
  border: 1px solid var(--line);
  background: #fff;
  color: #333;
  border-radius: 7px;
  padding: 9px 13px;
  text-decoration: none;
  display: inline-block;
}
.btn.dark { background: #303236; border-color: #303236; color: #fff; }
.sign-shell { max-width: 1050px; margin: 0 auto; padding: 28px; }
.sign-head {
  background: #fff;
  border: 1px solid var(--line);
  padding: 16px 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}
.sign-doc { background: #e9e9e6; padding: 25px; }
.sign-page {
  position: relative;
  margin: 0 auto 20px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
  max-width: 820px;
}
.sign-page canvas { width: 100%; display: block; }
.overlay { position: absolute; inset: 0; }
.field {
  position: absolute;
  border: 1px solid #aaa;
  background: #fafaf8;
  display: flex;
  align-items: center;
  justify-content: center;
}
.field.assigned { border: 2px solid #3f4347; background: #f0f0ed; }
.field input { width: 100%; height: 100%; border: 0; background: transparent; padding: 3px; font-size: 11px; }
.sign-footer { display: flex; justify-content: flex-end; margin-top: 18px; }
.empty {
  padding: 70px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed #cfd0ce;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.8);
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 20, 0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-card {
  background: #fff;
  width: min(470px, 92vw);
  border-radius: 12px;
  padding: 25px;
  box-shadow: var(--shadow);
}
.modal-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 14px; }
.toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  background: #303236;
  color: #fff;
  padding: 11px 15px;
  border-radius: 7px;
  z-index: 200;
  box-shadow: var(--shadow);
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Updated Google Apps Script Web App API URL
const API = 'https://script.google.com/macros/s/AKfycbxW499aNhUq5xCFyG9_4Fu4tl-X8Z6kWiUlMlLWooINI05sVguvZvAGA7E_YmCe6rKt5Q/exec';

const state = {
  signToken: new URLSearchParams(location.search).get('token'),
  completedMode: new URLSearchParams(location.search).get('completed') === '1',
  signSession: null,
  signingBusy: false
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function toast(m) {
  const e = document.createElement('div');
  e.className = 'toast';
  e.textContent = m;
  $('#toastRoot').append(e);
  setTimeout(() => e.remove(), 2600);
}

function modal(html) {
  $('#modalRoot').innerHTML = `<div class="modal"><div class="modal-card">${html}</div></div>`;
}

function closeModal() {
  $('#modalRoot').innerHTML = '';
}

async function api(action, data = {}) {
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, data })
    });
    return await r.json();
  } catch(e) {
    return { success: false, message: 'Could not connect to backend.' };
  }
}

async function render() {
  if (state.completedMode && state.signToken) {
    renderCompletedDocument();
    return;
  }
  if (!state.signToken) {
    $('#app').innerHTML = `
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:12px">SignedIt</div>
          <h2>Invalid Link</h2>
          <div>No signing token was provided in the URL.</div>
        </div>
      </div>`;
    return;
  }

  const r = await api('signingSession', { token: state.signToken });
  if (!r.success) {
    $('#app').innerHTML = `
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:12px">SignedIt</div>
          <h2>Signing Link Unavailable</h2>
          <div>${esc(r.message)}</div>
        </div>
      </div>`;
    return;
  }

  state.signSession = r.data;
  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="sign-head">
        <div><div class="brand">SignedIt</div></div>
        <div style="margin-left:auto">Signing as <b>${esc(r.data.recipient.name)}</b></div>
      </div>
      <div class="sign-doc" id="signDoc"></div>
      <div class="sign-footer">
        <button class="btn dark" onclick="submitSigner()">Finish signing</button>
      </div>
    </div>`;

  await renderSignPdf(r.data);
}

async function renderSignPdf(data) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(fromB64(data.pdfBase64)) }).promise;
  const host = $('#signDoc');
  
  for (let n = 1; n <= pdf.numPages; n++) {
    const p = await pdf.getPage(n);
    const vp = p.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    await p.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    
    const pg = document.createElement('div');
    pg.className = 'sign-page';
    const ov = document.createElement('div');
    ov.className = 'overlay';
    pg.append(canvas, ov);
    host.append(pg);

    data.fields.filter(f => f.page === n - 1).forEach(f => {
      const owned = !f.recipientRole || String(f.recipientRole) === String(data.recipient.sequence);
      const el = document.createElement('div');
      el.className = 'field' + (owned ? ' assigned' : '');
      el.style.cssText = `left:${f.x * 100}%;top:${f.y * 100}%;width:${f.w * 100}%;height:${f.h * 100}%`;

      if (!owned) {
        el.style.pointerEvents = 'none';
        el.style.border = '0';
        el.style.background = 'transparent';
        ov.append(el);
        return;
      }

      if (f.type === 'signature' || f.type === 'initials') {
        el.textContent = f.value ? 'Signed' : 'Click to sign';
        el.onclick = () => signatureFor(f, el);
      } else {
        const i = document.createElement('input');
        i.type = 'text';
        i.value = f.value || '';
        i.oninput = () => f.value = i.value;
        el.append(i);
      }
      ov.append(el);
    });
  }
}

let sigTarget = null, sigTargetElement = null;
function signatureFor(f, el) {
  sigTarget = f;
  sigTargetElement = el;
  modal(`
    <h2>Your signature</h2>
    <canvas id="sigPad" width="600" height="180" style="width:100%;border:1px dashed #aaa;border-radius:7px;touch-action:none"></canvas>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" onclick="applySignerSig()">Apply</button>
    </div>
  `);
  
  const c = $('#sigPad'), ctx = c.getContext('2d');
  let down = false;
  
  c.onpointerdown = e => {
    down = true;
    c.setPointerCapture(e.pointerId);
    const r = c.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo((e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height);
  };
  c.onpointermove = e => {
    if (!down) return;
    const r = c.getBoundingClientRect();
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineTo((e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height);
    ctx.stroke();
  };
  c.onpointerup = () => down = false;
}

function applySignerSig() {
  const c = $('#sigPad');
  if (!c || !sigTarget) return;
  sigTarget.value = c.toDataURL('image/png');
  closeModal();
  if (sigTargetElement) sigTargetElement.textContent = 'Signed';
}

async function submitSigner() {
  if (state.signingBusy) return;
  const data = {};
  
  for (const f of state.signSession.fields) {
    const owned = !f.recipientRole || String(f.recipientRole) === String(state.signSession.recipient.sequence);
    if (!owned) continue;
    if (f.required && (!f.value || String(f.value) === '')) return toast('Please complete all required fields.');
    data[f.id] = f.value;
  }

  state.signingBusy = true;
  const finalPdfBase64 = await buildCompletedPdf();
  const r = await api('submitSigning', {
    token: state.signToken,
    values: data,
    pdfBase64: finalPdfBase64,
    signingUrl: location.origin + location.pathname
  });

  if (!r.success) {
    state.signingBusy = false;
    return toast(r.message);
  }

  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="empty">
        <div class="brand" style="margin-bottom:12px">SignedIt</div>
        <h2>Thank You</h2>
        <div>Your signature step has been completed successfully.</div>
      </div>
    </div>`;
}

async function buildCompletedPdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.load(fromB64(state.signSession.pdfBase64));
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const pages = pdfDoc.getPages();

  for (const f of state.signSession.fields) {
    const owned = !f.recipientRole || String(f.recipientRole) === String(state.signSession.recipient.sequence);
    if (!owned || !f.value) continue;

    const page = pages[Number(f.page)];
    const pageW = page.getWidth(), pageH = page.getHeight();
    const x = f.x * pageW, y = pageH - ((f.y + f.h) * pageH), w = f.w * pageW, h = f.h * pageH;

    if (f.type === 'signature' || f.type === 'initials') {
      if (String(f.value).startsWith('data:image/')) {
        const bytes = Uint8Array.from(atob(String(f.value).split(',')[1]), c => c.charCodeAt(0));
        const image = await pdfDoc.embedPng(bytes);
        page.drawImage(image, { x, y, width: w, height: h });
      }
    } else {
      page.drawText(String(f.value), { x: x + 4, y: y + (h / 4), size: 10, font, color: rgb(.15, .15, .15) });
    }
  }
  return toB64(await pdfDoc.save());
}

async function renderCompletedDocument() {
  const r = await api('completedDocument', { token: state.signToken });
  if (!r.success) {
    $('#app').innerHTML = `
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:12px">SignedIt</div>
          <h2>Document Not Ready</h2>
          <div>${esc(r.message)}</div>
        </div>
      </div>`;
    return;
  }

  const bytes = Uint8Array.from(atob(r.pdfBase64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);

  $('#app').innerHTML = `
    <div class="sign-shell">
      <div class="empty">
        <div class="brand" style="margin-bottom:12px">SignedIt</div>
        <h2>Completed Document</h2>
        <div style="margin-bottom:20px">${esc(r.documentName)}</div>
        <a class="btn dark" href="${url}" download="${esc(r.documentName)}">Download Signed PDF</a>
      </div>
    </div>`;
}

function fromB64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer; }
function toB64(buf) {
  const b = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}

render();
</script>
</body>
</html>
